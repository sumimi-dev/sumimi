[package]
name = "sumimi-cli"
description = "Sumimi CLI — read and analyze a Sumimi DuckDB database offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **A crates.io name is permanent**: a version can be yanked, but a crate cannot
# be renamed. The project was called `sumami` until v0.2.0 — those crates
# (sumami-service, sumami-cli v0.1.0) stay where they are; these are the ones
# to use.

[lib]
name = "sumimi_cli"
path = "src/lib.rs"

[features]
default = ["duckdb-static"]
# Static DuckDB: the executable is self-contained (one file to deploy).
#
# The feature is forwarded to the service crate: the service links DuckDB too,
# and one crate can only be built one way.
duckdb-static = ["duckdb/bundled", "sumimi-service/duckdb-static"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
duckdb.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }

# The decompressor for the geolocation database.
#
# Why: **every free geolocation database is published gzipped** — the file is
# a tenth of the size that way, and the download is the slow part. So the
# download has to unpack it.
#
# Why `miniz_oxide` (the default backend): it is pure Rust, so the binary
# stays self-contained — no C library to install next to it, and the release
# is still one file.
flate2 = "1"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
# The shared layer: the schema, the models and every report live here, so the
# server and the client cannot drift apart.
#
# The version is needed for publishing: the path is used locally, and the
# version is what the published crate depends on.
sumimi-service = { path = "../service", version = "0.5.1" }
