[workspace]
resolver = "2"
members = ["service", "cli", "sumimi"]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/sumimi-dev/sumimi"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `process` is for the supervisor: `sumimi service` owns the server as a child
# process and has to wait for it. It is a feature of a dependency we already
# have, not a new one.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# DuckDB 2.0.0 (crate version 1.20000.x encodes "20000" -> 2.0.0).
#
# The default build **statically links** DuckDB (`bundled`), so the release is a
# single self-contained executable: copy one file, run it, done. No shared
# library, no LD_LIBRARY_PATH, no rpath.
#
# Build with `--no-default-features` for a smaller executable that links the
# prebuilt libduckdb dynamically (then libduckdb.so has to ship next to it).
# See AGENTS.md §4.1.
duckdb = { version = "1", default-features = false, features = ["chrono", "uuid"] }
