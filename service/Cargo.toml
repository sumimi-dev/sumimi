[package]
name = "sumimi-service"
description = "Sumimi analytics service — single-binary, DuckDB-backed, Umami-compatible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **A crates.io name is permanent**: a version can be yanked, but a crate cannot
# be renamed. The project was called `sumami` until v0.2.0 — those crates
# (sumami-service, sumami-cli v0.1.0) stay where they are; these are the ones
# to use.

# The server is a library: the one and only executable (`sumimi`) lives in the
# `cli` crate and uses it for both the server and the client.
[lib]
name = "sumimi_service"
path = "src/lib.rs"

[features]
default = ["tls", "duckdb-static"]
# TLS (ACME certificate management). Disable for a smaller binary when a reverse
# proxy terminates TLS instead.
tls = ["dep:rustls-acme", "dep:axum-server", "dep:tokio-stream"]
# Static DuckDB: the executable is self-contained (one file to deploy).
# There is one build: this one.
duckdb-static = ["duckdb/bundled"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
duckdb.workspace = true

# The alternative data engine. SQLite is bundled (compiled in), so the release is
# still one self-contained file — it grows by about 1.2 MB.
#
# Why a second engine: the data plane (the events) is append-only and read as
# aggregations, which DuckDB does cheaper and faster; but everything else an
# instance keeps — logins, logs, the GSC import, the cache, query snapshots,
# the AI chat history — is small, mutable and transactional, which SQLite does
# better. The two live in separate files for exactly that reason.
#
# The uptime checker needs an HTTP client, and it needs one that does not pull
# a whole async stack into the process: `ureq` is blocking, small, and already
# in the tree (the CLI uses it for the HTTP mode). The checker runs on a
# blocking thread, never on the request path.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The `functions` feature is the one thing rusqlite keeps behind a flag: it lets
# SQLite call back into Rust. The migration from schema v3 to v4 needs it —
# SQLite has no hash of its own, so the old text ids are turned into UUIDs by a
# function we register (the same SHA-256 the DuckDB migration uses).
rusqlite = { version = "0.37", features = ["bundled", "chrono", "functions"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

# The geolocation database.
#
# Why: the **mmdb format is the de facto standard** — MaxMind publishes it,
# DB-IP publishes it, IP2Location publishes it. Everybody who ships a
# geolocation database ships one of these, so the file the site owner
# downloads is one of these, and there is nothing to convert.
#
# Why not write the parser ourselves: the format is a binary search tree with
# a data section and a separated by a documented layout, and every edge case
# in it has been found by other people already. It would be a lot of code for
# no gain — and the reader is *not* on the hot path: the file is read once, at
# startup, and the lookup is an in-memory search.
maxminddb = "0.32"

# TLS / ACME. `ring` keeps the build simple (no cmake, no aws-lc-sys).
rustls-acme = { version = "0.15", default-features = false, features = [
    "ring",
    "axum",
    "tokio",
    "tls12",
    "webpki-roots",
], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
