# The tests, in two paths.
#
# **The basic path** runs on every push and every pull request: the functional
# tests, in a few minutes. It is the layer that says "the product does what it
# says" — every endpoint, every report, every migration, the collector, the
# writer, the permissions. Anyone who clones the repository can run it.
#
# **The budget path** runs daily (and on demand): the two memory budgets, on
# Linux, where the peak resident set can be read exactly. The numbers it
# records — RSS, the engine's own usage, the write latency — are the ones the
# product is specified against, so they are recorded in the run and not just
# printed.
#
# The heavy tests (millions of rows, the comparison with other
# implementations) live in the private repository — see issue #4. What is
# measured here is published as `benchmarks/<date>.md` when it needs to be.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A little after the hour, so the daily run does not pile up with everyone
    # else's midnight jobs.
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # The basic path: the functional tests.
  # ---------------------------------------------------------------------
  test:
    name: The functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # DuckDB is compiled from source, so the build is the slow part. The
      # cache is what keeps a pull request's tests down to minutes.
      - name: The cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: The tests
        run: cargo test --workspace

      - name: The tracker's tests
        working-directory: tracker
        run: |
          deno check src/mod.ts
          deno test --allow-env src/

  # ---------------------------------------------------------------------
  # The lint: the code has to be clean.
  # ---------------------------------------------------------------------
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `cargo fmt --check` here on purpose: the repository was formatted
      # with an older rustfmt, and the current one would rewrite every file
      # in it (the style edition changed). A formatting gate that fails on
      # every file is not a gate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------
  # The four axes: DuckDB against SQLite, on the same history.
  # ---------------------------------------------------------------------
  axes:
    name: The engines, four axes
    runs-on: ubuntu-latest
    # The build of DuckDB from source is the slow part, and the measurement
    # follows it. The job was at 19 minutes against a 20-minute limit, so the
    # limit was the thing that decided the result.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: The cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-

      # The public tool: a second implementation, so the measurement does not
      # inherit the server's bugs.
      #
      # **The version is pinned** ✓ ⇒ ⇒ ⇒ the report has to be the same every
      # time ✓ ⇒ ⇒ ⇒ (the tool's charts and its numbers are part of what is
      # published ✓ ⇒ ⇒ ⇒ so a moving pin would move the numbers under the
      # reader's feet ✓ ⇒ ⇒ ⇒) ⇒ ⇒ ⇒ ⇒ v0.3.1 ✓ ⇒ ⇒ ⇒ the mixed charts and
      # the limits ✓
      - name: The load generator
        run: |
          set -euo pipefail
          curl -sL --retry 5 -o gotest.tar.gz \
            "https://github.com/sumimi-dev/sumimi-gotest/releases/download/v0.3.1/sumimi-gotest-linux-amd64.tar.gz"
          tar xzf gotest.tar.gz
          sudo mv sumimi-gotest-linux-amd64 /usr/local/bin/sumimi-gotest
          sumimi-gotest version

      # The **release** binary: a debug build's peak says nothing about the
      # memory the product costs.
      - name: The server
        run: cargo build --release -p sumimi --bin sumimi

      # The four axes, on three years of history: the peak memory, the data on
      # disk, the latency of the reports over a long range — and the limit's
      # trade (the time, the peak and the spill at several engine limits).
      #
      # **Three years, not one**: a one-year report fits in memory at every
      # limit, so the spill would be "0" everywhere and the reader would learn
      # nothing. Three years is what makes the engine spill, and the spill is
      # what the limit costs. It is also the history the published benchmark
      # uses, so the routine report and the document agree.
      - name: The axes
        run: |
          set -euo pipefail
          SUMIMI_ADMIN_PASSWORD=sumimi-gotest sumimi-gotest axes \
            --binary target/release/sumimi \
            --backends duckdb,sqlite \
            --days 1095 \
            --visitors 1000 \
            --ranges 0.17,0.5,1 \
            --limits 512MB,256MB,128MB,64MB \
            --out axes.md \
            --json axes.json

      - name: The numbers
        run: |
          {
            echo "### The engines, four axes"
            echo
            cat axes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: the-axes
          path: axes.*

  # ---------------------------------------------------------------------
  # The budget path: the two memory budgets, on Linux.
  # ---------------------------------------------------------------------
  budget:
    name: The memory budget (${{ matrix.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Daily, and by hand — not on every push: it builds the whole thing twice.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: minimum
            engine: 128MB
            ceiling: 256
          - tier: recommended
            engine: 256MB
            ceiling: 512
    steps:
      - uses: actions/checkout@v4

      - name: Build the release binary
        run: cargo build --release -p sumimi-service --example memory_budget

      # The assertion: the process peaked above its ceiling → the job is red.
      # The peak is the exact high-water mark from /proc/self/status (VmHWM).
      - name: The ${{ matrix.tier }} budget (${{ matrix.engine }} engine, ${{ matrix.ceiling }} MB ceiling)
        run: |
          ./target/release/examples/memory_budget --engine ${{ matrix.engine }} \
            | tee budget-${{ matrix.tier }}.txt

      - name: The numbers
        run: |
          {
            echo "### The memory budget — ${{ matrix.tier }}"
            echo
            echo '```'
            cat budget-${{ matrix.tier }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
