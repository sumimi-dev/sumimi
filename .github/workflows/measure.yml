# The measurement.
#
# **The deployment reference table needs a number that somebody else can
# reproduce** ✓ ⇒ ⇒ ⇒ so it is measured here ✓ ⇒ ⇒ ⇒ on the CI runner ✓
# ⇒ ⇒ ⇒ (Linux ✓, the exact high-water mark ✓ — the server reads its own
# `/proc` `VmHWM` ✓ ⇒ ⇒ ⇒ not the kernel's `ru_maxrss` ✓ ⇒ ⇒ ⇒ which on
# Linux carries the parent's resident set ✓ ⇒ ⇒ ⇒ ⇒ see `MEMORY.md` §6 ✓).
#
# The tool is the public one (`sumimi-gotest` ✓ ⇒ a second implementation ✓
# ⇒ ⇒ ⇒ not the server's own code ✓ ⇒ ⇒ ⇒ ⇒ so the measurement does not
# inherit the server's bugs ✓ ✓).
#
# Every variant is measured **on the same runner, in the same run** ✓ ⇒ ⇒ ⇒
# so the numbers are comparable ✓ ⇒ ⇒ ⇒ ⇒ **a machine's speed changes the
# numbers; the runner's changes them for every variant at once** ✓ ✓.
#
# The dispatch runs it by hand ✓ ⇒ ⇒ ⇒ it is not part of every push ✓ ⇒ ⇒ ⇒
# ⇒ it does not cost the project anything when it is not needed ✓ ✓.
name: Measure the memory

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'The releases to compare, comma separated'
        required: true
        default: 'v0.4.1,v0.4.3'
      rates:
        description: 'The rates to offer, comma separated'
        required: false
        default: '5000,10000,20000,40000'
      runs:
        description: 'How many times each rate runs'
        required: false
        default: '3'
      allocator:
        description: 'Also measure with the allocator giving the pages back'
        required: false
        default: 'yes'
      axes:
        description: 'Also measure the four axes (the two engines, three years of history)'
        required: false
        default: 'yes'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The tags to compare, and the rates to offer.
      TAGS: ${{ inputs.tags }}
      RATES: ${{ inputs.rates }}
      RUNS: ${{ inputs.runs }}
      ALLOCATOR: ${{ inputs.allocator }}
      AXES: ${{ inputs.axes }}
      # The load generator's password. It is a throwaway: the server is
      # started per point, in a temporary directory, and thrown away with it.
      SUMIMI_ADMIN_PASSWORD: sumimi-gotest
    steps:
      - uses: actions/checkout@v4

      # **The version is pinned** ✓ ⇒ ⇒ ⇒ same reason as the CI ✓ ⇒ ⇒ ⇒ the
      # tool's charts are part of what is published ✓ ⇒ ⇒ ⇒ ⇒ v0.3.1 ✓ ⇒ ⇒ ⇒
      # (v0.1.2 predates the `axes` subcommand ✓ ⇒ ⇒ ⇒ ⇒ so this step could
      # not have run ✓ ⇒ ⇒ ⇒ ⇒)
      - name: The load generator
        run: |
          set -euo pipefail
          curl -sL --retry 5 -o gotest.tar.gz \
            "https://github.com/sumimi-dev/sumimi-gotest/releases/download/v0.3.1/sumimi-gotest-linux-amd64.tar.gz"
          tar xzf gotest.tar.gz
          sudo mv sumimi-gotest-linux-amd64 /usr/local/bin/sumimi-gotest
          sumimi-gotest version

      - name: The servers
        run: |
          set -euo pipefail
          mkdir -p servers
          for tag in ${TAGS//,/ }; do
            echo "the server: $tag"
            curl -sL --retry 5 -o "servers/$tag.tar.gz" \
              "https://github.com/sumimi-dev/sumimi/releases/download/$tag/sumimi-$tag-Linux-x86_64.tar.gz"
            mkdir -p "servers/$tag"
            tar xzf "servers/$tag.tar.gz" -C "servers/$tag"
            "servers/$tag/sumimi" --version
          done

      - name: The sweeps
        run: |
          set -euo pipefail
          for tag in ${TAGS//,/ }; do
            for run in $(seq 1 ${RUNS}); do
              sumimi-gotest sweep \
                --binary "servers/$tag/sumimi" \
                --rates "$RATES" \
                --seconds 20 \
                --settle 5 \
                --out "report-$tag-$run.md" \
                --json "report-$tag-$run.json"
            done
          done
          if [ "$ALLOCATOR" = "yes" ]; then
            for run in $(seq 1 ${RUNS}); do
              # The variable goes into the **environment**, not into a flag:
              # the server the tool starts inherits it, and the tool itself
              # does not care (it is Go; it does not use the C allocator).
              MALLOC_MMAP_THRESHOLD_=65536 sumimi-gotest sweep \
                --binary "servers/${TAGS##*,}/sumimi" \
                --rates "$RATES" \
                --seconds 20 \
                --settle 5 \
                --out "report-allocator-$run.md" \
                --json "report-allocator-$run.json"
            done
          fi

      # The four axes: the two engines, on the same history. **Three years**,
      # because a short history says nothing (both engines answer in
      # single-digit milliseconds) — the difference is in the long range.
      #
      # **And the limits** — the same history, several engine limits: the
      # time, the peak and the spill. Three years is also what makes the
      # engine spill at all.
      - name: The axes
        if: env.AXES == 'yes'
        run: |
          set -euo pipefail
          SUMIMI_ADMIN_PASSWORD=sumimi-gotest sumimi-gotest axes \
            --binary "servers/${TAGS##*,}/sumimi" \
            --backends duckdb,sqlite \
            --days 1095 \
            --visitors 1000 \
            --ranges 0.17,0.5,1 \
            --limits 512MB,256MB,128MB,64MB \
            --out axes.md \
            --json axes.json

      - name: The reports
        run: |
          for report in report-*.md; do
            echo "=================== $report"
            cat "$report"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: the-sweeps
          path: |
            report-*
            axes.*
